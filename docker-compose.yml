services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - cartoonverse-temp:/tmp/cartoonverse
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
    env_file:
      - ./.env
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - cartoonverse-temp:/tmp/cartoonverse
    command: celery -A app.celery_app.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./.env
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  cartoonverse-temp:
